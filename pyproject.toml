[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "holo_fleet"
version = "0.1.0"
description = "Leaderless, communication-free UUV fleet from identical local hybrid automata (HoloOcean + Z3)"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib", "opencv-python", "z3-solver", "imageio"]

[tool.setuptools.packages.find]
include = ["holo_fleet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: suites that take more than a few seconds (deselect with -m 'not slow')",
    "holoocean: needs the (patched) HoloOcean engine; starts a simulation",
]
