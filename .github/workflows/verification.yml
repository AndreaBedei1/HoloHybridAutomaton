name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MARINE_RACE_ARENA_ROOT: ${{ github.workspace }}/arena-fixture
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AndreaBedei1/HoloDroneCompetition
          ref: 439ddf6d9ac0d777b59f4d130f291cb07c5b4663
          path: arena-fixture
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/verification.yml
      - run: python -m pip install -e . pytest==8.4.2 z3-solver==5.1.0.0
      - run: python scripts/verify_legacy_index.py
      - run: python formal/check_properties.py --quick
      - run: python -m pytest -q -m "not slow and not holoocean"

  formal-complete:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MARINE_RACE_ARENA_ROOT: ${{ github.workspace }}/arena-fixture
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AndreaBedei1/HoloDroneCompetition
          ref: 439ddf6d9ac0d777b59f4d130f291cb07c5b4663
          path: arena-fixture
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/verification.yml
      - run: python -m pip install -e . pytest==8.4.2 z3-solver==5.1.0.0
      - run: python formal/check_properties.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-results
          path: formal/results/
